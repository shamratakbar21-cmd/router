/etc/nurrouter/device-id
/etc/nurrouter/identity/
/etc/nurrouter/bootstrap/
/etc/nurrouter/mgmt/
/etc/nurrouter/license.json
/etc/nurrouter/license-last-refresh
/etc/nurrouter/license-entitlements.json
/etc/nurrouter/license-public-keys.json
/etc/nurrouter/update-public-keys.json
/etc/nurrouter/pppoe-shaping.json
/etc/nurrouter/runtime/backups/

/etc/nurrouter/bras.json

# Durable RADIUS queue includes credentials; root-only, never a public support dump.
/etc/nurrouter/accounting/

