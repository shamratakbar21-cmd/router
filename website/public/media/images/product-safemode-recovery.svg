<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-label="Safe Mode Watchdog and Revision Control">
  <defs>
    <linearGradient id="cardBg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141e2b"/>
      <stop offset="100%" stop-color="#1f3247"/>
    </linearGradient>
  </defs>
  <rect width="640" height="280" fill="url(#cardBg4)"/>
  <!-- Revision History Cards -->
  <g transform="translate(42, 46)">
    <rect x="24" y="0" width="260" height="156" rx="5" fill="#162638" stroke="#36516d"/>
    <rect x="12" y="16" width="260" height="156" rx="5" fill="#122030" stroke="#456587"/>
    <rect x="0" y="32" width="260" height="156" rx="5" fill="#0c1622" stroke="#00a9e8" stroke-width="1.5"/>
    <text x="20" y="60" fill="#7cd8ff" font-family="monospace" font-size="11" font-weight="700">REVISION #14 · STAGED</text>
    <text x="20" y="84" fill="#29d17d" font-family="monospace" font-size="11">+ vlan 20 tagged eth1</text>
    <text x="20" y="104" fill="#29d17d" font-family="monospace" font-size="11">+ route 10.40.0.0/16</text>
    <text x="20" y="124" fill="#f87171" font-family="monospace" font-size="11">- drop wan2 legacy rule</text>
    <rect x="20" y="142" width="136" height="28" rx="3" fill="#176bcc"/>
    <text x="88" y="160" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="10" font-weight="700">APPLY WITH SAFE MODE</text>
  </g>
  <!-- Safe Mode Watchdog Ring -->
  <g transform="translate(468, 140)">
    <circle cx="0" cy="0" r="82" fill="#0c1622" stroke="#2c4560" stroke-width="8"/>
    <circle cx="0" cy="0" r="82" fill="none" stroke="#29d17d" stroke-width="8" stroke-dasharray="380 520" stroke-linecap="round" transform="rotate(-90)"/>
    <text x="0" y="-12" text-anchor="middle" fill="#8fa7bf" font-family="monospace" font-size="10" font-weight="700">WATCHDOG TIMER</text>
    <text x="0" y="16" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="26" font-weight="700">01:45</text>
    <text x="0" y="38" text-anchor="middle" fill="#29d17d" font-family="monospace" font-size="10">AUTO-ROLLBACK READY</text>
  </g>
</svg>

