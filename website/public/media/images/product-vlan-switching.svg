<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-label="Routing, Interfaces and 802.1Q VLANs">
  <defs>
    <linearGradient id="cardBg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#122132"/>
      <stop offset="100%" stop-color="#1d3550"/>
    </linearGradient>
    <linearGradient id="metal1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef3f8"/>
      <stop offset="100%" stop-color="#bcc8d6"/>
    </linearGradient>
  </defs>
  <rect width="640" height="280" fill="url(#cardBg1)"/>
  <g stroke="#294766" stroke-width="1" opacity="0.45">
    <line x1="0" y1="56" x2="640" y2="56"/><line x1="0" y1="112" x2="640" y2="112"/><line x1="0" y1="168" x2="640" y2="168"/><line x1="0" y1="224" x2="640" y2="224"/>
    <line x1="128" y1="0" x2="128" y2="280"/><line x1="256" y1="0" x2="256" y2="280"/><line x1="384" y1="0" x2="384" y2="280"/><line x1="512" y1="0" x2="512" y2="280"/>
  </g>
  <!-- Switch / Router Front Panel -->
  <rect x="44" y="64" width="552" height="94" rx="5" fill="url(#metal1)" stroke="#8fa1b5" stroke-width="2"/>
  <rect x="56" y="76" width="528" height="70" rx="3" fill="#14202c"/>
  <rect x="70" y="90" width="84" height="42" rx="3" fill="#176bcc"/>
  <text x="112" y="109" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="11" font-weight="700">802.1Q VLAN</text>
  <text x="112" y="123" text-anchor="middle" fill="#bfe0ff" font-family="monospace" font-size="9">BR-LAN / WAN</text>
  <!-- 6 Ethernet Ports -->
  <g transform="translate(172, 88)">
    <g transform="translate(0,0)"><rect width="54" height="44" rx="3" fill="#0b1118" stroke="#00b7ff" stroke-width="1.5"/><circle cx="10" cy="9" r="3" fill="#00d4ff"/><text x="27" y="32" text-anchor="middle" fill="#7cd8ff" font-family="monospace" font-size="10">WAN</text></g>
    <g transform="translate(66,0)"><rect width="54" height="44" rx="3" fill="#0b1118" stroke="#6d8196" stroke-width="1.5"/><circle cx="10" cy="9" r="3" fill="#29d17d"/><text x="27" y="32" text-anchor="middle" fill="#cbd8e6" font-family="monospace" font-size="10">ETH1</text></g>
    <g transform="translate(132,0)"><rect width="54" height="44" rx="3" fill="#0b1118" stroke="#6d8196" stroke-width="1.5"/><circle cx="10" cy="9" r="3" fill="#29d17d"/><text x="27" y="32" text-anchor="middle" fill="#cbd8e6" font-family="monospace" font-size="10">ETH2</text></g>
    <g transform="translate(198,0)"><rect width="54" height="44" rx="3" fill="#0b1118" stroke="#6d8196" stroke-width="1.5"/><circle cx="10" cy="9" r="3" fill="#29d17d"/><text x="27" y="32" text-anchor="middle" fill="#cbd8e6" font-family="monospace" font-size="10">VLAN10</text></g>
    <g transform="translate(264,0)"><rect width="54" height="44" rx="3" fill="#0b1118" stroke="#6d8196" stroke-width="1.5"/><circle cx="10" cy="9" r="3" fill="#29d17d"/><text x="27" y="32" text-anchor="middle" fill="#cbd8e6" font-family="monospace" font-size="10">VLAN20</text></g>
    <g transform="translate(330,0)"><rect width="54" height="44" rx="3" fill="#0b1118" stroke="#29d17d" stroke-width="1.5"/><circle cx="10" cy="9" r="3" fill="#29d17d"/><text x="27" y="32" text-anchor="middle" fill="#6ee7b7" font-family="monospace" font-size="10">PPPoE</text></g>
  </g>
  <!-- Bottom Telemetry Tags -->
  <rect x="44" y="182" width="172" height="52" rx="4" fill="#0d1824" stroke="#2f4d6c"/>
  <text x="60" y="203" fill="#6bc8f5" font-family="monospace" font-size="10" font-weight="700">STATIC &amp; DHCP WAN</text>
  <text x="60" y="221" fill="#b8c9da" font-family="monospace" font-size="11">IPv4 / IPv6 Dual-Stack</text>

  <rect x="234" y="182" width="172" height="52" rx="4" fill="#0d1824" stroke="#2f4d6c"/>
  <text x="250" y="203" fill="#6bc8f5" font-family="monospace" font-size="10" font-weight="700">BRIDGE 802.1Q</text>
  <text x="250" y="221" fill="#b8c9da" font-family="monospace" font-size="11">Tagged / Untagged Ports</text>

  <rect x="424" y="182" width="172" height="52" rx="4" fill="#0d1824" stroke="#2f4d6c"/>
  <text x="440" y="203" fill="#6bc8f5" font-family="monospace" font-size="10" font-weight="700">DNS &amp; DHCP POOLS</text>
  <text x="440" y="221" fill="#b8c9da" font-family="monospace" font-size="11">Leases &amp; Resolvers</text>
</svg>

