serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1 --rtscts=off
terminal_input console serial; terminal_output console serial

set default="0"
set timeout="15"

# BIOS El Torito exposes the disc as (cd); the UEFI El Torito boot image is
# loaded through (cd0).
if [ "${grub_platform}" = "efi" ]; then
        set cdroot='(cd0)'
else
        set cdroot='(cd)'
fi

menuentry "NurRouterOS installer" {
        echo "Loading the NurRouterOS installer kernel ..."
        linux /boot/vmlinuz console=tty1 console=ttyS0,115200n8 nur.mode=install nur.interactive=1
        echo "Loading the installer initramfs ..."
        initrd /boot/initramfs.cpio.gz
}

menuentry "NurRouterOS installer (unattended)" {
        echo "Unattended mode refuses to run without an explicit target disk."
        echo "Edit this entry (press 'e') and add: nur.disk=/dev/sdX nur.confirm=ERASE-sdX"
        linux /boot/vmlinuz console=tty1 console=ttyS0,115200n8 nur.mode=install nur.interactive=0 nur.autoreboot=1
        initrd /boot/initramfs.cpio.gz
}

menuentry "NurRouterOS recovery console" {
        linux /boot/vmlinuz console=tty1 console=ttyS0,115200n8 nur.mode=recovery nur.interactive=1
        initrd /boot/initramfs.cpio.gz
}

menuentry "NurRouterOS installer (dry run, nothing is written)" {
        linux /boot/vmlinuz console=tty1 console=ttyS0,115200n8 nur.mode=install nur.interactive=1 nur.dryrun=1
        initrd /boot/initramfs.cpio.gz
}
