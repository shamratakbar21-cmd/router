serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1 --rtscts=off
terminal_input console serial; terminal_output console serial

set default="0"
set timeout="15"

# BIOS El Torito exposes the disc as (cd); the UEFI El Torito boot image is
# loaded through (cd0).
if [ "${grub_platform}" = "efi" ]; then
        set cdroot='(cd0)'
else
        set cdroot='(cd)'
fi

menuentry "NurRouterOS installer (graphical / iDRAC console)" {
	linux /boot/vmlinuz console=tty0 nur.mode=install nur.interactive=1
        initrd /boot/initramfs.cpio.gz
}

menuentry "NurRouterOS installer (serial ttyS0, 115200)" {
	linux /boot/vmlinuz console=ttyS0,115200n8 nur.mode=install nur.interactive=1
        initrd /boot/initramfs.cpio.gz
}

menuentry "NurRouterOS recovery (graphical / iDRAC console)" {
	linux /boot/vmlinuz console=tty0 nur.mode=recovery nur.interactive=1
        initrd /boot/initramfs.cpio.gz
}

menuentry "NurRouterOS recovery (serial ttyS0, 115200)" {
	linux /boot/vmlinuz console=ttyS0,115200n8 nur.mode=recovery nur.interactive=1
	initrd /boot/initramfs.cpio.gz
}

menuentry "NurRouterOS installer dry run (graphical, no writes)" {
	linux /boot/vmlinuz console=tty0 nur.mode=install nur.interactive=1 nur.dryrun=1
	initrd /boot/initramfs.cpio.gz
}

menuentry "NurRouterOS installer unattended (serial ttyS0)" {
	linux /boot/vmlinuz console=ttyS0,115200n8 nur.mode=install nur.interactive=0 nur.autoreboot=1
        initrd /boot/initramfs.cpio.gz
}
