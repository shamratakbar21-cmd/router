server {
    listen 80;
    listen [::]:80;
    server_name docs.nurrouter.com download.nurrouter.com cloud.nurrouter.com license.nurrouter.com updates.nurrouter.com;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/nurrouter-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name docs.nurrouter.com;
    ssl_certificate /etc/letsencrypt/live/nurrouter-public-aliases/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nurrouter-public-aliases/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    if ($request_method !~ "^(GET|HEAD)$") { return 405; }
    location = / { return 302 https://nurrouter.com/docs; }
    location = /docs { return 302 https://nurrouter.com/docs; }
    location ^~ /docs/ { return 302 https://nurrouter.com$request_uri; }
    location ^~ /media/ { return 302 https://nurrouter.com$request_uri; }
    location ^~ /releases/ { return 302 https://nurrouter.com$request_uri; }
    location / { return 302 https://nurrouter.com/docs$request_uri; }
}

